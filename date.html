<body>
<a id="ir" href="/">Ver o date</a>
<script>var v=(new URLSearchParams(location.search).get('i')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,64);var para=v?'/?date='+v:'/';document.getElementById('ir').href=para;location.replace(para);</script>
