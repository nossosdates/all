<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Migrar dados</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;line-height:1.5}button{font-size:16px;padding:12px 16px;border-radius:10px;border:0;background:#d6336c;color:#fff;margin:6px 0;display:block;width:100%}button:disabled{opacity:.4}pre{background:#f3f3f3;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:13px}</style></head><body>
<h2>Migrar dados (antigo → novo)</h2>
<p>1) Entre no projeto ANTIGO com o Google do Bruno. 2) Entre no projeto NOVO com o mesmo Google. 3) Copie.</p>
<button id="b1">1) Entrar no ANTIGO e ler os dados</button>
<button id="b2" disabled>2) Entrar no NOVO</button>
<button id="b3" disabled>3) Copiar para o NOVO</button>
<button id="b4" disabled style="background:#555">Baixar backup (.json)</button>
<pre id="log">Aguardando…</pre>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
const OLD={apiKey:"AIzaSyC8SdTZEi5TcJNEnrX16YAfb9kCf329yT4",authDomain:"bruno-e-beatriz-dates.firebaseapp.com",projectId:"bruno-e-beatriz-dates",appId:"1:512656464234:web:302840fa38009596226d13"};
const NEW={apiKey:"AIzaSyC9QOjVvGRAh1ZIZpir8GxdNP_UBi7m9i4",authDomain:"nossosdates-app.firebaseapp.com",projectId:"nossosdates-app",appId:"1:157852870199:web:36273ec8a73ca8a3f7c1b2"};
const aO=initializeApp(OLD,'old'), aN=initializeApp(NEW,'new');
const dO=getFirestore(aO), dN=getFirestore(aN), authO=getAuth(aO), authN=getAuth(aN);
const $=id=>document.getElementById(id); const log=t=>$('log').textContent+='\n'+t; $('log').textContent='Pronto.';
let dados={};
$('b1').onclick=async()=>{ try{
  const u=(await signInWithPopup(authO,new GoogleAuthProvider())).user; log('ANTIGO: entrou como '+u.email);
  const s=await getDoc(doc(dO,'casal','state')); if(!s.exists()) throw new Error('casal/state não encontrado');
  dados['casal/state']=s.data(); log('Lido casal/state ('+JSON.stringify(dados['casal/state']).length+' bytes)');
  const us=await getDoc(doc(dO,'users',u.uid)); if(us.exists()){ log('Aviso: existe users/'+u.uid+' → '+JSON.stringify(us.data())+' (não copiado; o app recria).'); }
  $('b2').disabled=false; $('b4').disabled=false;
 }catch(e){ log('ERRO: '+(e.code||'')+' '+e.message); } };
$('b2').onclick=async()=>{ try{
  const u=(await signInWithPopup(authN,new GoogleAuthProvider())).user; log('NOVO: entrou como '+u.email); $('b3').disabled=false;
 }catch(e){ log('ERRO: '+(e.code||'')+' '+e.message); } };
$('b3').onclick=async()=>{ try{
  const ref=doc(dN,'casal','state'); const ja=await getDoc(ref);
  if(ja.exists() && !confirm('Já existe casal/state no NOVO. Sobrescrever?')) return;
  await setDoc(ref,dados['casal/state']);
  const v=await getDoc(ref); log('Copiado. Conferência: '+(v.exists()&&JSON.stringify(v.data())===JSON.stringify(dados['casal/state'])?'IGUAL ✅':'DIFERENTE ⚠️'));
 }catch(e){ log('ERRO: '+(e.code||'')+' '+e.message); } };
$('b4').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(dados,null,1)],{type:'application/json'})); a.download='backup-nossos-dates.json'; a.click(); };
</script></body></html>
