  --border: #443552;
  --text: #F3ECE6;
  --text-dim: #B6A8C2;
  --text-faint: #83739A;
  --gold: #D8A94E;
  --gold-soft: #4A3B2A;
  --cat-restaurante: #E8735A;
  --cat-viagem: #4FA8A0;
  --cat-batevolta: #D9A544;
  --cat-casa: #C97B94;
  --cat-cultura: #8393E0;
  --cat-aventura: #7FB06B;
  --cat-experiencia: #B97BC9;
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{
  background: radial-gradient(ellipse at top, #261C33 0%, #1E1626 55%);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding-bottom: 60px;
}
::selection{ background: var(--gold); color: #241A10; }

h1,h2,h3,.serif{ font-family: 'Fraunces', serif; }

button{ font-family: inherit; cursor:pointer; border:none; }
input,select,textarea{ font-family: inherit; }

/* Header */
.hero{
  padding: 28px 20px 18px;
  max-width: 720px;
  margin: 0 auto;
}
.hero-top{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
}
.hero-top h1{
  font-size: 26px; font-weight: 600; letter-spacing: -0.01em;
}
.hero-top h1 span{ color: var(--gold); }
.hero-top h1.hero-subtitle{
  font-size: 20px; font-weight: 600; color: var(--gold); margin-top: 2px; letter-spacing: -0.01em;
}
.counter-badge{
  text-align:right;
}
.counter-badge .num{
  font-family:'Fraunces',serif; font-size: 30px; font-weight:700; color: var(--gold); line-height:1;
  display:block;
}
.counter-badge .label{
  font-size: 11px; color: var(--text-faint); margin-top:2px;
}
.cal-quick-btn{
  background: var(--surface); border:1px solid var(--border); color: var(--text);
  width:38px; height:38px; border-radius: 50%; font-size:17px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.cal-quick-btn:active{ transform: scale(0.94); }

/* Week strip */
.week-strip{
  max-width: 720px; margin: 18px auto 0; padding: 0 20px;
}
.week-strip .title{
  font-size: 12px; color: var(--text-faint); margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center;
}
.week-nav{ display:flex; gap:4px; }
.week-nav button{
  background: var(--surface); color: var(--text-dim); width:22px; height:22px; border-radius:6px; font-size:12px;
}
.week-grid{
  display:grid; grid-template-columns: repeat(7,1fr); gap:6px;
}
.week-day{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  padding: 8px 4px 10px;
  text-align:center;
  min-height: 64px;
  position:relative;
  cursor:pointer;
  transition: border-color .15s ease;
}
.week-day:hover{ border-color: var(--text-faint); }
.week-day.today{ border-color: var(--gold); background: var(--gold-soft); }
.week-day .dow{ font-size:10px; color: var(--text-faint); text-transform:uppercase; letter-spacing:.04em; }
.week-day .dom{ font-size:15px; font-weight:600; margin-top:2px; }
.week-day .dots{ display:flex; gap:3px; justify-content:center; margin-top:6px; flex-wrap:wrap; }
.week-day .dot{ width:6px; height:6px; border-radius:50%; }

/* Sorteio buttons */
.sorteio-row{
  max-width: 720px; margin: 18px auto 0; padding: 0 20px;
}
.sorteio-btn{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-m);
  padding: 14px 12px; text-align:left; color: var(--text);
  display:flex; flex-direction:column; gap:2px;
}
.sorteio-btn .ic{ font-size:20px; }
.sorteio-btn .t{ font-size:13.5px; font-weight:600; margin-top:4px; }
.sorteio-btn .s{ font-size:11px; color: var(--text-faint); }
.sorteio-btn:active{ transform: scale(0.98); }
.sorteio-btn-single{
  width:100%; background: linear-gradient(135deg, var(--surface-2), var(--surface));
  border:1px solid var(--gold); border-radius: var(--radius-m);
  padding: 18px 16px; display:flex; align-items:center; gap:12px; color: var(--text);
}
.sorteio-btn-single .ic{ font-size:28px; }
.sorteio-btn-single .txt{ text-align:left; }
.sorteio-btn-single .t{ font-size:15px; font-weight:700; }
.sorteio-btn-single .s{ font-size:11.5px; color: var(--text-faint); margin-top:2px; }
.sorteio-btn-single:active{ transform: scale(0.98); }

/* Tabs */
.tabs{
  max-width: 720px; margin: 22px auto 0; padding: 0 20px;
  display:flex; gap: 6px; border-bottom: 1px solid var(--border);
  overflow-x:auto; white-space:nowrap;
}
.tab{
  background:none; color: var(--text-faint); padding: 10px 4px; font-size: 14px; font-weight:600;
  border-bottom: 2px solid transparent; margin-right: 14px;
}
.tab.active{ color: var(--text); border-color: var(--gold); }

.content{ max-width: 720px; margin: 0 auto; padding: 18px 20px 40px; }

/* Filter bar */
.filter-bar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.filter-bar select, .filter-bar input[type=text]{
  background: var(--surface); border:1px solid var(--border); color: var(--text);
  border-radius: 20px; padding: 7px 12px; font-size: 12.5px;
}
.add-fab{
  background: var(--gold); color:#241A10; font-weight:700; border-radius: 20px;
  padding: 7px 14px; font-size:12.5px; margin-left:auto;
}

/* Place card */
.place-card{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-m);
  padding: 14px 14px; margin-bottom: 10px; cursor:pointer;
  border-left: 3px solid var(--cat-color, var(--gold));
}
.place-card .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.place-card .name{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; }
.place-card .meta{ font-size:11.5px; color: var(--text-faint); margin-top:3px; }
.place-card .badge{
  font-size: 10px; padding: 3px 8px; border-radius: 20px; white-space:nowrap;
  background: color-mix(in srgb, var(--cat-color) 25%, transparent);
  color: var(--cat-color);
  font-weight:600;
}
.place-card .notes-preview{ font-size:12.5px; color: var(--text-dim); margin-top:8px; line-height:1.4; }
.empty-state{ text-align:center; padding: 40px 20px; color: var(--text-faint); }
.empty-state .big{ font-size: 32px; margin-bottom: 8px; }

/* Calendar */
.cal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.cal-header h2{ font-size: 17px; font-weight:600; text-transform:capitalize; }
.cal-header .nav{ display:flex; gap:6px; align-items:center; }
.cal-header .nav button{ background: var(--surface); color:var(--text); width:28px; height:28px; border-radius:8px; }
.cal-view-toggle{ display:flex; gap:6px; margin-bottom:16px; background:var(--surface); padding:4px; border-radius:12px; width:fit-content; }
.cal-view-btn{ background:none; color:var(--text-faint); padding:6px 16px; border-radius:9px; font-size:12.5px; font-weight:600; }
.cal-view-btn.active{ background: var(--surface-2); color: var(--text); }
.cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
.cal-dow{ text-align:center; font-size:10px; color:var(--text-faint); padding-bottom:4px; text-transform:uppercase; }
.cal-grid-month .cal-cell{ aspect-ratio: unset; min-height: 64px; text-align:left; align-items:flex-start; }
.cal-cell{
  background: var(--surface); border:1px solid var(--border); border-radius: 8px;
  padding: 4px; font-size:11px; position:relative; cursor:pointer;
  display:flex; flex-direction:column; gap:3px;
}
.cal-cell .daynum{ font-size:11px; color: var(--text-dim); }
.cal-cell.other-month{ opacity: 0.35; }
.cal-cell.today .daynum{
  background: var(--gold); color:#241A10; width:18px; height:18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:700;
}
.cal-cell .pill{
  font-size: 9.5px; padding: 1.5px 5px; border-radius: 4px; color: #1A1220; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cal-cell .more{ font-size: 9px; color: var(--text-faint); padding-left:2px; }
.legend{ display:flex; flex-wrap:wrap; gap: 10px; margin-top:16px; }
.legend .item{ display:flex; align-items:center; gap:5px; font-size:11px; color: var(--text-dim); }
.legend .dot{ width:8px; height:8px; border-radius:50%; }

/* Agenda list view */
.agenda-daygroup{ display:flex; gap:12px; margin-bottom:14px; }
.agenda-datecol{ width:46px; flex-shrink:0; text-align:center; padding-top:2px; }
.agenda-datecol .dow{ font-size:10px; color: var(--text-faint); text-transform:uppercase; }
.agenda-datecol .dom{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; }
.agenda-datecol.today .dom{ color: var(--gold); }
.agenda-events{ flex:1; display:flex; flex-direction:column; gap:6px; }
.agenda-event{
  background: var(--surface); border-left: 3px solid var(--cat-color, var(--gold)); border-radius: 8px;
  padding: 9px 12px; cursor:pointer;
}
.agenda-event .name{ font-size:13.5px; font-weight:600; }
.agenda-event .sub{ font-size:11px; color: var(--text-faint); margin-top:1px; }

/* Timeline */
.tl-month{ font-size:12px; color: var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin: 18px 0 8px; }
.tl-month:first-child{ margin-top:0; }
.tl-item{
  display:flex; gap:12px; align-items:flex-start; background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius-m); padding: 12px 14px; margin-bottom:8px; cursor:pointer;
}
.tl-item .dot{ width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.tl-item .info{ flex:1; }
.tl-item .top{ display:flex; justify-content:space-between; gap:8px; }
.tl-item .name{ font-weight:600; font-size:14.5px; }
.tl-item .date{ font-size:11px; color: var(--text-faint); white-space:nowrap; }
.tl-item .note{ font-size:12.5px; color: var(--text-dim); margin-top:4px; }
.tl-item .stars{ color: var(--gold); font-size:11px; margin-top:4px; }

/* Modal */
.overlay{
  position:fixed; inset:0; background: rgba(15,10,20,0.7); backdrop-filter: blur(3px);
  display:flex; align-items:flex-end; justify-content:center; z-index: 50;
  opacity:0; pointer-events:none; transition: opacity .2s ease;
}
.overlay.open{ opacity:1; pointer-events:all; }
.sheet{
  background: var(--bg-soft); border-radius: 20px 20px 0 0; width:100%; max-width: 720px;
  max-height: 88vh; overflow-y:auto; padding: 20px 20px 28px;
  transform: translateY(30px); transition: transform .2s ease;
  border-top: 1px solid var(--border);
}
.overlay.open .sheet{ transform: translateY(0); }
.sheet-handle{ width:36px; height:4px; background: var(--border); border-radius:4px; margin: 0 auto 16px; }
.sheet h2{ font-size:19px; margin-bottom:16px; }
.field{ margin-bottom:12px; }
.field label{ font-size:11.5px; color: var(--text-faint); display:block; margin-bottom:5px; }
.field input, .field select, .field textarea{
  width:100%; background: var(--surface); border:1px solid var(--border); color: var(--text);
  border-radius: var(--radius-s); padding: 10px 12px; font-size:14px;
}
.field textarea{ min-height: 70px; resize:vertical; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  background: var(--surface); border:1px solid var(--border); color: var(--text-dim);
  padding: 7px 12px; border-radius: 20px; font-size: 12.5px;
}
.chip.selected{ background: var(--cat-color, var(--gold)); border-color: var(--cat-color, var(--gold)); color:#1A1220; font-weight:600; }
.sheet-actions{ display:flex; gap:10px; margin-top:18px; }
.btn{ flex:1; padding: 12px; border-radius: var(--radius-s); font-size:14px; font-weight:600; }
.btn-primary{ background: var(--gold); color:#241A10; }
.btn-ghost{ background: var(--surface); color: var(--text); border:1px solid var(--border); }
.btn-danger{ background: transparent; color: #E8735A; font-size:12.5px; padding: 8px; }

.sorteio-result{ text-align:center; padding: 10px 0 4px; }
.sorteio-result .cat-tag{ display:inline-block; font-size:11px; padding:4px 10px; border-radius:20px; margin-bottom:10px; }
.sorteio-result h3{ font-size:22px; margin-bottom:6px; }
.sorteio-result .addr{ font-size:12.5px; color:var(--text-faint); margin-bottom:10px; }
.sorteio-result .notes{ font-size:13px; color:var(--text-dim); text-align:left; background:var(--surface); border-radius:var(--radius-s); padding:12px; margin: 10px 0; }
.dice{ font-size: 40px; }
.loading-spin{ animation: spin 0.7s linear infinite; display:inline-block; }
@keyframes spin{ to{ transform: rotate(360deg); } }

.toggle-row{ display:flex; gap:8px; }
.toggle-opt{ flex:1; background: var(--surface); border:1px solid var(--border); color:var(--text-dim); padding:9px; border-radius: var(--radius-s); font-size:12.5px; text-align:center; }
.toggle-opt.selected{ background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }

.rating-row{ display:flex; gap:6px; font-size:22px; }
.rating-row span{ opacity:0.3; cursor:pointer; }
.rating-row span.on{ opacity:1; }

/* Próximo date */
.proximo-card{
  max-width: 720px; margin: 14px auto 0; padding: 0 20px;
  display:flex; align-items:center; gap:12px; cursor:pointer;
}
.proximo-card .inner{
  width:100%; background: linear-gradient(120deg, var(--gold-soft), var(--surface));
  border:1px solid var(--gold); border-radius: var(--radius-m); padding: 12px 16px;
  display:flex; align-items:center; gap:12px;
}
.proximo-ic{ font-size:24px; }
.proximo-when{ font-size:11px; color: var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.proximo-name{ font-size:14.5px; font-weight:600; margin-top:1px; }

/* Photo */
.place-card{ display:flex; gap:0; align-items:stretch; }
.place-card .pc-photo{ width:52px; height:52px; border-radius: 10px; object-fit:cover; margin-right:10px; flex-shrink:0; }
.place-card .pc-body{ flex:1; min-width:0; }
.photo-preview img{ width:100%; border-radius:10px; max-height:160px; object-fit:cover; display:block; }
.photo-remove{ font-size:11px; color:#E8735A; margin-top:6px; display:inline-block; }
.detail-photo{ width:100%; max-height:200px; object-fit:cover; border-radius: var(--radius-m); margin-bottom:12px; }

/* Roleta */
.roleta-name{ font-family:'Fraunces',serif; font-size:24px; font-weight:700; color: var(--gold); padding: 26px 0; }
.sorteio-weather{ font-size:12px; color: var(--text-faint); margin-top:2px; }

/* Clima tab */
.clima-current{
  display:flex; align-items:center; gap:14px; background: var(--surface); border:1px solid var(--border);
  border-radius: var(--radius-m); padding:16px; margin-bottom:16px;
}
.cc-icon{ font-size:44px; }
.cc-city{ font-size:13px; color: var(--text-dim); }
.cc-temp{ font-family:'Fraunces',serif; font-size:30px; font-weight:700; color: var(--gold); line-height:1.2; }
.cc-desc{ font-size:11.5px; color: var(--text-faint); margin-top:2px; }
.clima-forecast-label{ font-size:12px; color: var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
.clima-days{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
.clima-day{
  background: var(--surface); border:1px solid var(--border); border-radius: 12px;
  padding: 10px 8px; text-align:center; min-width: 58px; flex-shrink:0;
}
.cd-dow{ font-size:10px; color: var(--text-faint); text-transform:capitalize; }
.cd-icon{ font-size:20px; margin: 4px 0; }
.cd-max{ font-size:12.5px; font-weight:700; }
.cd-min{ font-size:11px; color: var(--text-faint); }
.cd-rain{ font-size:9.5px; color: var(--cat-viagem); margin-top:3px; }

@media (max-width: 380px){
  .sorteio-row{ grid-template-columns: 1fr; }
  .hero-top h1{ font-size: 22px; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div>
      <h1>Bruno <span>&</span> Beatriz</h1>
      <h1 class="hero-subtitle">Nossos Dates</h1>
    </div>
    <div style="display:flex; align-items:center; gap:10px">
      <button class="cal-quick-btn" onclick="goToCalendar()" title="Abrir calendário">📅</button>
      <div class="counter-badge">
        <span class="num" id="counterNum">0</span>
        <span class="label" id="counterLabel">dates juntos</span>
      </div>
    </div>
  </div>
</div>

<div class="week-strip">
  <div class="title">
    <span id="weekRangeLabel">Esta semana</span>
    <div class="week-nav">
      <button onclick="shiftWeek(-1)">‹</button>
      <button onclick="shiftWeek(0)">•</button>
      <button onclick="shiftWeek(1)">›</button>
    </div>
  </div>
  <div class="week-grid" id="weekGrid"></div>
</div>

<div class="proximo-card" id="proximoCard" style="display:none">
  <div class="inner" onclick="goToCalendar()">
    <span class="proximo-ic">💛</span>
    <div>
      <div class="proximo-when" id="proximoWhen"></div>
      <div class="proximo-name" id="proximoName"></div>
    </div>
  </div>
</div>

<div class="sorteio-row">
  <button class="sorteio-btn-single" onclick="openSorteio()">
    <span class="ic">🎲</span>
    <span class="txt">
      <div class="t">Sortear um date</div>
      <div class="s">escolha o tipo e a cidade</div>
    </span>
  </button>
</div>

<div class="tabs">
  <button class="tab active" data-tab="lugares" onclick="switchTab('lugares')">Ideias</button>
  <button class="tab" data-tab="calendario" onclick="switchTab('calendario')">Calendário</button>
  <button class="tab" data-tab="historico" onclick="switchTab('historico')">Histórico</button>
  <button class="tab" data-tab="clima" onclick="switchTab('clima')">Clima</button>
</div>

<div class="content">

  <!-- LUGARES -->
  <div id="tab-lugares">
    <div class="filter-bar">
      <input type="text" id="searchIdeias" placeholder="🔎 Buscar..." oninput="renderPlaces()" style="flex:1 1 100%;">
      <select id="filterCategoria" onchange="renderPlaces()"></select>
      <select id="filterCidade" onchange="renderPlaces()"></select>
      <select id="ordenarPor" onchange="renderPlaces()">
        <option value="nome">Nome (A-Z)</option>
        <option value="recente">Mais recente</option>
        <option value="visitado">Mais visitado</option>
      </select>
      <button class="toggle-opt" id="filtroFavoritosBtn" style="width:auto;flex:none;padding:7px 12px" onclick="toggleFiltroFavoritos()">⭐ Favoritos</button>
      <button class="cal-quick-btn" style="width:34px;height:34px;font-size:14px" onclick="requireAuth(openCategoriasManager)" title="Gerenciar categorias">⚙️</button>
      <button class="add-fab" onclick="requireAuth(openPlaceForm)">+ Ideia</button>
    </div>
    <div id="placesList"></div>
  </div>

  <!-- CALENDARIO -->
  <div id="tab-calendario" style="display:none">
    <div class="cal-view-toggle">
      <button class="cal-view-btn active" data-v="mes" onclick="setCalView('mes')">Mês</button>
      <button class="cal-view-btn" data-v="agenda" onclick="setCalView('agenda')">Agenda</button>
    </div>
    <div id="calMesView">
      <div class="cal-header">
        <h2 id="calMonthLabel"></h2>
        <div class="nav">
          <button onclick="shiftMonth(-1)">‹</button>
          <button onclick="goToday()" style="width:auto;padding:0 10px;font-size:11px">hoje</button>
          <button onclick="shiftMonth(1)">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid cal-grid-month" id="calGrid" style="margin-top:5px"></div>
      <div class="legend" id="calLegend"></div>
    </div>
    <div id="calAgendaView" style="display:none">
      <div id="agendaList"></div>
    </div>
  </div>

  <!-- HISTORICO -->
  <div id="tab-historico" style="display:none">
    <div id="timelineList"></div>
  </div>

  <!-- CLIMA -->
  <div id="tab-clima" style="display:none">
    <div class="filter-bar" style="margin-bottom:16px">
      <input type="text" id="climaCidadeInput" placeholder="Buscar cidade..." value="Curitiba" style="flex:1">
      <button class="add-fab" onclick="buscarClima()">Buscar</button>
    </div>
    <div id="climaContent"></div>
  </div>

</div>

<!-- MODAL: Place form -->
<div class="overlay" id="overlayPlace">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="placeFormTitle">Nova ideia</h2>
    <div class="field">
      <label>Nome</label>
      <input type="text" id="fName" placeholder="Ex: Madero, Trilha do Marumbi...">
    </div>
    <div class="field">
      <label>Categoria</label>
      <div class="chip-row" id="fCategoriaChips"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Cidade</label>
        <input type="text" id="fCidade" placeholder="Curitiba">
      </div>
      <div class="field">

<script>
const DEFAULT_CATEGORIES = [
  {key:'restaurante', label:'Restaurante', hex:'#E8735A'},
  {key:'viagem', label:'Viagem', hex:'#4FA8A0'},
  {key:'batevolta', label:'Bate e volta', hex:'#D9A544'},
  {key:'casa', label:'Casa / Chill', hex:'#C97B94'},
  {key:'cultura', label:'Evento cultural', hex:'#8393E0'},
  {key:'aventura', label:'Aventura', hex:'#7FB06B'},
  {key:'experiencia', label:'Experiência', hex:'#B97BC9'},
];
const COLOR_POOL = ['#E8735A','#4FA8A0','#D9A544','#C97B94','#8393E0','#7FB06B','#B97BC9','#5FB3D9','#D97BB0','#8BC98A'];
function catInfo(key){
  return (state.categories||DEFAULT_CATEGORIES).find(c=>c.key===key) || {key:'', label:'Categoria', hex:'#D8A94E'};
}

let state = { places: [], events: [], categories: DEFAULT_CATEGORIES.map(c=>({...c})) };
const EDIT_PASSWORD = '0901';
let isUnlocked = false;
let pendingAction = null;
function requireAuth(action){
  if(isUnlocked){ action(); return; }
  pendingAction = action;
  document.getElementById('senhaInput').value = '';
  document.getElementById('senhaErro').style.display = 'none';
  openOverlayEl('overlaySenha');
  setTimeout(()=>document.getElementById('senhaInput').focus(), 200);
}
function submitSenha(){
  const val = document.getElementById('senhaInput').value;
  if(val === EDIT_PASSWORD){
    isUnlocked = true;
    closeOverlay('overlaySenha');
    const action = pendingAction; pendingAction = null;
    if(action) action();
  } else {
    document.getElementById('senhaErro').style.display = 'block';
  }
}
document.getElementById('senhaInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitSenha(); });
let editingPlaceId = null;
let currentWeekOffset = 0;
let currentMonthDate = new Date();
let sorteioCategorias = new Set();
let sorteioExcluirDias = 0;
let sorteioCurrentResult = null;

const todayStr = () => fmtDate(new Date());
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function loadState(){
  await new Promise(resolve=>{
    if(window.__firebase) resolve();
    else window.addEventListener('firebase-ready', resolve, {once:true});
  });
  const { stateDocRef, onSnapshot } = window.__firebase;
  onSnapshot(stateDocRef, (snap)=>{
    if(snap.exists()){
      const data = snap.data();
      state = { places: data.places || [], events: data.events || [], categories: (data.categories && data.categories.length) ? data.categories : DEFAULT_CATEGORIES.map(c=>({...c})) };
    } else {
      state = { places: [], events: [], categories: DEFAULT_CATEGORIES.map(c=>({...c})) };
    }
    renderAll();
  }, (err)=>{
    console.error('Erro ao sincronizar com o Firestore', err);
    document.getElementById('placesList').innerHTML = `<div class="empty-state">Não deu pra conectar com o banco de dados agora.<br>Confere sua internet e recarrega a página.</div>`;
  });
}
async function saveState(){
  try{
    const { stateDocRef, setDoc } = window.__firebase;
    await setDoc(stateDocRef, state);
  }catch(e){ console.error('erro ao salvar no Firestore', e); }
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  ['lugares','calendario','historico','clima'].forEach(n=>{
    document.getElementById('tab-'+n).style.display = (n===name)?'block':'none';
  });
  if(name==='calendario'){ renderCalendar(); if(calView==='agenda') renderAgenda(); }
  if(name==='historico') renderTimeline();
  if(name==='clima' && !climaLoadedOnce){ climaLoadedOnce = true; buscarClima(); }
}

function closeOverlay(id){ document.getElementById(id).classList.remove('open'); }
function openOverlayEl(id){ document.getElementById(id).classList.add('open'); }

/* ---------- WEEK STRIP ---------- */
function shiftWeek(delta){
  if(delta===0) currentWeekOffset = 0; else currentWeekOffset += delta;
  renderWeekStrip();
}
function renderWeekStrip(){
  const now = new Date();
  const base = new Date(now);
  base.setDate(now.getDate() - now.getDay() + currentWeekOffset*7);
  const grid = document.getElementById('weekGrid');
  grid.innerHTML='';
  const dows = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  for(let i=0;i<7;i++){
    const d = new Date(base); d.setDate(base.getDate()+i);
    const ds = fmtDate(d);
    const isToday = ds === todayStr();
    const dayEvents = state.events.filter(e=>e.date===ds);
    const cell = document.createElement('div');
    cell.className = 'week-day'+(isToday?' today':'');
    cell.onclick = ()=>requireAuth(()=>openEventForm(ds));
    cell.innerHTML = `<div class="dow">${dows[i]}</div><div class="dom">${d.getDate()}</div>
      <div class="dots">${dayEvents.map(e=>{
        const p = state.places.find(pl=>pl.id===e.placeId);
        const c = p? catInfo(p.category).hex : '#D8A94E';
        return `<span class="dot" style="background:${c}"></span>`;
      }).join('')}</div>`;
    grid.appendChild(cell);
  }
  const rangeLabel = currentWeekOffset===0 ? 'Esta semana' : (currentWeekOffset>0? currentWeekOffset+' semana(s) à frente' : Math.abs(currentWeekOffset)+' semana(s) atrás');
  document.getElementById('weekRangeLabel').textContent = rangeLabel;
}

/* ---------- COUNTER ---------- */
function renderCounter(){
  const past = state.events.filter(e=>e.date <= todayStr());
  document.getElementById('counterNum').textContent = past.length;
  document.getElementById('counterLabel').textContent = past.length===1 ? 'date juntos' : 'dates juntos';
}
function renderProximo(){
  const upcoming = state.events.filter(e=>e.date>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date));
  const card = document.getElementById('proximoCard');
  if(upcoming.length===0){ card.style.display='none'; return; }
  const next = upcoming[0];
  const p = state.places.find(pl=>pl.id===next.placeId);
  const diffDays = Math.round((parseDate(next.date) - parseDate(todayStr())) / 86400000);
  let when;
  if(diffDays===0) when = 'Hoje';
  else if(diffDays===1) when = 'Amanhã';
  else when = `Em ${diffDays} dias · ${formatDateLong(next.date)}`;
  document.getElementById('proximoWhen').textContent = when;
  document.getElementById('proximoName').textContent = p? p.name : 'Date marcado';
  card.style.display = 'flex';
}

/* ---------- PLACES TAB ---------- */
function populateFilters(){
  const catSel = document.getElementById('filterCategoria');
  catSel.innerHTML = '<option value="">Todas categorias</option>' + state.categories.map(c=>`<option value="${c.key}">${c.label}</option>`).join('');
  const cities = [...new Set(state.places.map(p=>p.city).filter(Boolean))];
  const citySel = document.getElementById('filterCidade');
  citySel.innerHTML = '<option value="">Todas cidades</option>' + cities.map(c=>`<option value="${c}">${c}</option>`).join('');
}
let filtroFavoritosAtivo = false;
function toggleFiltroFavoritos(){
  filtroFavoritosAtivo = !filtroFavoritosAtivo;
  document.getElementById('filtroFavoritosBtn').classList.toggle('selected', filtroFavoritosAtivo);
  renderPlaces();
}
function renderPlaces(){
  const catF = document.getElementById('filterCategoria').value;
  const cityF = document.getElementById('filterCidade').value;
  const searchF = document.getElementById('searchIdeias').value.trim().toLowerCase();
  const ordenar = document.getElementById('ordenarPor').value;
  let list = state.places.filter(p => (!catF || p.category===catF) && (!cityF || p.city===cityF) && (!searchF || p.name.toLowerCase().includes(searchF)) && (!filtroFavoritosAtivo || p.favorite));
  const container = document.getElementById('placesList');
  if(list.length===0){
    container.innerHTML = `<div class="empty-state"><div class="big">💌</div>${searchF? 'Nada encontrado pra essa busca.' : 'Nenhuma ideia por aqui ainda.<br>Toca em "+ Ideia" pra começar a lista.'}</div>`;
    return;
  }
  const visitCount = id => state.events.filter(e=>e.placeId===id).length;
  if(ordenar==='recente') list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  else if(ordenar==='visitado') list.sort((a,b)=>visitCount(b.id)-visitCount(a.id));
  else list.sort((a,b)=>a.name.localeCompare(b.name));
  container.innerHTML = list.map(p=>{
    const c = catInfo(p.category);
    const visits = state.events.filter(e=>e.placeId===p.id);
    return `<div class="place-card" style="--cat-color:${c.hex}" onclick="openPlaceDetail('${p.id}')">
      ${p.photo? `<img class="pc-photo" src="${escapeHtml(p.photo)}" onerror="this.style.display='none'">`:''}
      <div class="pc-body">
        <div class="row1">
          <div>
            <div class="name">${p.favorite? '⭐ ':''}${escapeHtml(p.name)}</div>
            <div class="meta">${p.city? escapeHtml(p.city)+' · ':''}${'💰'.repeat(Number(p.price||1))}${visits.length? ' · '+visits.length+'x visitado':''}</div>
          </div>
          <span class="badge">${c.label}</span>
        </div>
        ${p.notes? `<div class="notes-preview">${escapeHtml(p.notes).slice(0,100)}${p.notes.length>100?'...':''}</div>`:''}
        <div style="display:flex; gap:14px; margin-top:8px" onclick="event.stopPropagation()">
          <button style="background:none; color:var(--text-faint); font-size:12px" onclick="requireAuth(()=>toggleFavorite('${p.id}'))">${p.favorite? '★ Favorito':'☆ Favoritar'}</button>
          <button style="background:none; color:var(--text-faint); font-size:12px" onclick="requireAuth(()=>openPlaceForm(state.places.find(pl=>pl.id==='${p.id}')))">✎ Editar</button>
          <button style="background:none; color:var(--cat-restaurante); font-size:12px" onclick="requireAuth(()=>quickDeletePlace('${p.id}'))">🗑 Excluir</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function metaLineWithMaps(p){
  const parts = [];
  if(p.city) parts.push(escapeHtml(p.city));
  const mapsQuery = [p.address, p.city].filter(Boolean).join(', ');
  if(mapsQuery){
    const url = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mapsQuery);
    parts.push(`<a href="${url}" target="_blank" style="color:var(--gold)">📍 ${p.address? escapeHtml(p.address):'ver no mapa'}</a>`);
  }
  return parts.join(' · ');
}

function openPlaceForm(existing){
  editingPlaceId = existing? existing.id : null;
  document.getElementById('placeFormTitle').textContent = existing? 'Editar ideia' : 'Nova ideia';
  document.getElementById('fName').value = existing? existing.name : '';
  document.getElementById('fCidade').value = existing? existing.city : '';
  document.getElementById('fPreco').value = existing? existing.price : '1';
  document.getElementById('fEndereco').value = existing? existing.address||'' : '';
  document.getElementById('fLink').value = existing? existing.link||'' : '';
  document.getElementById('fPhoto').value = existing? existing.photo||'' : '';
  document.getElementById('fNotes').value = existing? existing.notes||'' : '';
  document.getElementById('deletePlaceBtn').style.display = existing? 'block':'none';
  const chipRow = document.getElementById('fCategoriaChips');
  const selectedCat = existing? existing.category : 'restaurante';
  chipRow.innerHTML = state.categories.map(c=>`<button type="button" class="chip ${c.key===selectedCat?'selected':''}" style="--cat-color:${c.hex}" data-cat="${c.key}" onclick="selectFormCat('${c.key}')">${c.label}</button>`).join('');
  chipRow.dataset.selected = selectedCat;
  openOverlayEl('overlayPlace');
}
function selectFormCat(key){
  const chipRow = document.getElementById('fCategoriaChips');
  chipRow.dataset.selected = key;
  [...chipRow.children].forEach(ch=>{
    ch.classList.toggle('selected', ch.dataset.cat===key);
    ch.style.setProperty('--cat-color', catInfo(ch.dataset.cat).hex);
  });
}
async function savePlace(){
  const name = document.getElementById('fName').value.trim();
  if(!name){ alert('Dá um nome pro lugar :)'); return; }
  const data = {
    name,
    category: document.getElementById('fCategoriaChips').dataset.selected,
    city: document.getElementById('fCidade').value.trim(),
    price: document.getElementById('fPreco').value,
    address: document.getElementById('fEndereco').value.trim(),
    link: document.getElementById('fLink').value.trim(),
    photo: document.getElementById('fPhoto').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
  };
  if(editingPlaceId){
    const p = state.places.find(pl=>pl.id===editingPlaceId);
    Object.assign(p, data);
  } else {
    data.id = uid(); data.createdAt = todayStr();
    state.places.push(data);
  }
  await saveState();
  closeOverlay('overlayPlace');
  populateFilters(); renderPlaces(); renderCalendar(); renderTimeline(); renderCounter(); renderWeekStrip();
}
async function deletePlace(){
  if(!editingPlaceId) return;
  if(!confirm('Excluir este lugar e o histórico de visitas dele?')) return;
  state.places = state.places.filter(p=>p.id!==editingPlaceId);
  state.events = state.events.filter(e=>e.placeId!==editingPlaceId);
  await saveState();
  closeOverlay('overlayPlace'); closeOverlay('overlayDetail');
  populateFilters(); renderPlaces(); renderCalendar(); renderTimeline(); renderCounter(); renderWeekStrip(); renderProximo();
}
async function quickDeletePlace(id){
  if(!confirm('Excluir este lugar e o histórico de visitas dele?')) return;
  state.places = state.places.filter(p=>p.id!==id);
  state.events = state.events.filter(e=>e.placeId!==id);
  await saveState();
  populateFilters(); renderPlaces(); renderCalendar(); renderTimeline(); renderCounter(); renderWeekStrip(); renderProximo();
}
async function toggleFavorite(id){
  const p = state.places.find(pl=>pl.id===id);
  if(!p) return;
  p.favorite = !p.favorite;
  await saveState();
  renderPlaces();
}

function openPlaceDetail(id){
  const p = state.places.find(pl=>pl.id===id);
  if(!p) return;
  const c = catInfo(p.category);
  const visits = state.events.filter(e=>e.placeId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const html = `
    <div class="sheet-handle"></div>
    ${p.photo? `<img class="detail-photo" src="${escapeHtml(p.photo)}" onerror="this.style.display='none'">`:''}
    <span class="badge" style="--cat-color:${c.hex}">${c.label}</span>
    <h2 style="margin-top:8px">${escapeHtml(p.name)}</h2>
    <div class="meta" style="color:var(--text-faint);font-size:12.5px;margin-bottom:4px">${metaLineWithMaps(p)}</div>

    ${p.link? `<div style="font-size:12.5px;margin-bottom:8px"><a href="${escapeHtml(p.link)}" target="_blank" style="color:var(--gold)">${escapeHtml(p.link)}</a></div>`:''}
    ${p.notes? `<div class="notes" style="margin-top:10px">${escapeHtml(p.notes)}</div>`:''}
    <div style="margin-top:16px;font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em">Histórico de visitas (${visits.length})</div>
    <div style="margin-top:8px">
      ${visits.length? visits.map(v=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12.5px;color:var(--text-dim)">${formatDateLong(v.date)}</span>
          ${v.rating? `<span style="color:var(--gold);font-size:11px">${'★'.repeat(v.rating)}${'☆'.repeat(5-v.rating)}</span>`:''}
        </div>
        ${v.note? `<div style="font-size:12.5px;color:var(--text-faint);margin-top:2px">${escapeHtml(v.note)}</div>`:''}
        ${v.photo? `<img src="${escapeHtml(v.photo)}" onerror="this.style.display='none'" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-top:6px">`:''}
      </div>`).join('') : '<div style="font-size:12.5px;color:var(--text-faint)">Ainda não foram juntos aqui.</div>'}
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeOverlay('overlayDetail')">Fechar</button>

function compartilharIdeia(id){
  const p = state.places.find(pl=>pl.id===id);
  if(!p) return;
  const c = catInfo(p.category);
  const texto = `💛 Ideia de date: *${p.name}*\n${c.label}${p.city? ' · '+p.city:''}\n${p.notes? p.notes+'\n':''}${p.link||''}`;
  compartilharTexto(texto);
}
function compartilharTexto(texto){
  if(navigator.share){
    navigator.share({text: texto}).catch(()=>{});
  } else {
    window.open('https://wa.me/?text='+encodeURIComponent(texto), '_blank');
  }
}
function formatDateLong(ds){
  const d = parseDate(ds);
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short', year:'numeric'});
}

/* ---------- CALENDAR TAB ---------- */
let calView = 'mes';
function goToCalendar(){
  switchTab('calendario');
  document.querySelector('.tabs').scrollIntoView({behavior:'smooth', block:'start'});
}
function setCalView(v){
  calView = v;
  document.querySelectorAll('.cal-view-btn').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  document.getElementById('calMesView').style.display = v==='mes' ? 'block':'none';
  document.getElementById('calAgendaView').style.display = v==='agenda' ? 'block':'none';
  if(v==='agenda') renderAgenda();
}
function goToday(){ currentMonthDate = new Date(); renderCalendar(); }
function shiftMonth(delta){
  currentMonthDate.setMonth(currentMonthDate.getMonth()+delta);
  renderCalendar();
}
function renderCalendar(){
  const y = currentMonthDate.getFullYear(), m = currentMonthDate.getMonth();
  document.getElementById('calMonthLabel').textContent = currentMonthDate.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  const dowRow = document.getElementById('calDow');
  dowRow.innerHTML = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const firstDay = new Date(y,m,1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const grid = document.getElementById('calGrid');
  grid.innerHTML='';
  const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startOffset + 1;
    const cellDate = new Date(y,m,dayNum);
    const ds = fmtDate(cellDate);
    const inMonth = dayNum>=1 && dayNum<=daysInMonth;
    const dayEvents = state.events.filter(e=>e.date===ds);
    const cell = document.createElement('div');
    cell.className = 'cal-cell'+(inMonth?'':' other-month')+(ds===todayStr()?' today':'');
    cell.onclick = ()=>requireAuth(()=>openEventForm(ds));
    const shown = dayEvents.slice(0,2);
    const extra = dayEvents.length - shown.length;
    cell.innerHTML = `<span class="daynum">${cellDate.getDate()}</span>
      ${shown.map(e=>{
        const p = state.places.find(pl=>pl.id===e.placeId);
        const c = p? catInfo(p.category).hex:'#D8A94E';
        const label = p? p.name : 'Date';
        return `<span class="pill" style="background:${c}">${escapeHtml(label)}</span>`;
      }).join('')}
      ${extra>0? `<span class="more">+${extra} mais</span>`:''}`;
    grid.appendChild(cell);
  }
  document.getElementById('calLegend').innerHTML = state.categories.map(c=>`<div class="item"><span class="dot" style="background:${c.hex}"></span>${c.label}</div>`).join('');
}
function renderAgenda(){
  const upcoming = state.events.filter(e=>e.date>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date));
  const container = document.getElementById('agendaList');
  if(upcoming.length===0){
    container.innerHTML = `<div class="empty-state"><div class="big">🗓️</div>Nenhum date marcado ainda.<br>Toca em um dia no calendário ou no cronograma da semana pra marcar.</div>`;
    return;
  }
  const byDate = {};
  upcoming.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  container.innerHTML = Object.keys(byDate).sort().map(ds=>{
    const d = parseDate(ds);
    const dows = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
    const isToday = ds===todayStr();
    const evs = byDate[ds].map(e=>{
      const p = state.places.find(pl=>pl.id===e.placeId);
      const c = p? catInfo(p.category) : {hex:'#D8A94E', label:''};
      return `<div class="agenda-event" style="--cat-color:${c.hex}" onclick="openPlaceDetail('${e.placeId}')">
        <div class="name">${p? escapeHtml(p.name):'Date'}</div>
        <div class="sub">${c.label}${p&&p.city? ' · '+escapeHtml(p.city):''}</div>
      </div>`;
    }).join('');
    return `<div class="agenda-daygroup">
      <div class="agenda-datecol${isToday?' today':''}">
        <div class="dow">${dows[d.getDay()]}</div>
        <div class="dom">${d.getDate()}</div>
      </div>
      <div class="agenda-events">${evs}</div>
    </div>`;
  }).join('');
}

/* ---------- EVENT FORM (marcar/editar/excluir date num dia) ---------- */
let eventFormDate = null;
let eventFormRating = 0;
let editingEventId = null;
function renderRatingStars(){
  const row = document.getElementById('eRatingRow');
  row.innerHTML = [1,2,3,4,5].map(n=>`<span class="${n<=eventFormRating?'on':''}" onclick="setRating(${n})">★</span>`).join('');
}
function setRating(n){
  eventFormRating = (eventFormRating===n) ? 0 : n;
  renderRatingStars();
}
function renderExistingEventsForDay(ds){
  const evs = state.events.filter(e=>e.date===ds);
  const container = document.getElementById('existingEventsForDay');
  if(evs.length===0){ container.innerHTML=''; return; }
  container.innerHTML = `<div style="font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px">Já marcado nesse dia</div>` +
    evs.map(e=>{
      const p = state.places.find(pl=>pl.id===e.placeId);
      const c = p? catInfo(p.category) : {hex:'#D8A94E', label:''};
      return `<div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface); border-left:3px solid ${c.hex}; border-radius:8px; padding:9px 12px; margin-bottom:6px">
        <div>
          <div style="font-size:13.5px; font-weight:600">${p? escapeHtml(p.name):'Date'}</div>
          <div style="font-size:11px; color:var(--text-faint)">${c.label}${e.rating? ' · '+'★'.repeat(e.rating):''}</div>
        </div>
        <button style="background:none; color:var(--gold); font-size:12px; font-weight:600" onclick="editExistingEvent('${e.id}')">Editar</button>
      </div>`;
    }).join('');
}
function openEventForm(ds){
  eventFormDate = ds;
  eventFormRating = 0;
  editingEventId = null;
  document.getElementById('eventDateLabel').textContent = formatDateLong(ds);
  document.getElementById('eventFormLabel').textContent = 'Marcar novo date';
  document.getElementById('saveEventBtn').textContent = 'Marcar';
  document.getElementById('deleteEventBtn').style.display = 'none';
  renderExistingEventsForDay(ds);
  const sel = document.getElementById('eSelectPlace');
  if(state.places.length===0){
    sel.innerHTML = '<option value="">Cadastre uma ideia primeiro na aba Ideias</option>';
  } else {
    sel.innerHTML = state.places.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} (${catInfo(p.category).label})</option>`).join('');
  }
  document.getElementById('eNote').value='';
  document.getElementById('ePhoto').value='';
  document.getElementById('eRatingField').style.display = ds<=todayStr() ? 'block':'none';
  renderRatingStars();
  openOverlayEl('overlayEvent');
}
function editExistingEvent(eventId){
  const e = state.events.find(ev=>ev.id===eventId);
  if(!e) return;
  editingEventId = eventId;
  eventFormRating = e.rating || 0;
  document.getElementById('eventFormLabel').textContent = 'Editar date';
  document.getElementById('saveEventBtn').textContent = 'Salvar alterações';
  document.getElementById('deleteEventBtn').style.display = 'block';
  document.getElementById('eSelectPlace').value = e.placeId;
  document.getElementById('eNote').value = e.note || '';
  document.getElementById('ePhoto').value = e.photo || '';
  document.getElementById('eRatingField').style.display = e.date<=todayStr() ? 'block':'none';
  renderRatingStars();
}
async function deleteExistingEvent(eventId){
  if(!eventId) return;
  if(!confirm('Excluir esse date marcado?')) return;
  state.events = state.events.filter(e=>e.id!==eventId);
  await saveState();
  closeOverlay('overlayEvent');
  renderWeekStrip(); renderCalendar(); renderTimeline(); renderCounter(); renderPlaces(); renderProximo();
}
async function saveEvent(){
  const placeId = document.getElementById('eSelectPlace').value;
  if(!placeId) return;
  if(editingEventId){
    const e = state.events.find(ev=>ev.id===editingEventId);
    if(e){
      e.placeId = placeId;
      e.note = document.getElementById('eNote').value.trim();
      e.photo = document.getElementById('ePhoto').value.trim();
      e.rating = eventFormRating;
    }
  } else {
    state.events.push({
      id: uid(), placeId, date: eventFormDate,
      note: document.getElementById('eNote').value.trim(),
      photo: document.getElementById('ePhoto').value.trim(),
      rating: eventFormRating
    });
  }
  await saveState();
  closeOverlay('overlayEvent');
  renderWeekStrip(); renderCalendar(); renderTimeline(); renderCounter(); renderPlaces(); renderProximo();
}

/* ---------- TIMELINE (histórico) ---------- */
function renderTimeline(){
  const past = state.events.filter(e=>e.date<=todayStr()).sort((a,b)=>b.date.localeCompare(a.date));
  const container = document.getElementById('timelineList');
  if(past.length===0){
    container.innerHTML = `<div class="empty-state"><div class="big">🕰️</div>O histórico de vocês vai aparecer aqui<br>assim que marcarem o primeiro date.</div>`;
    return;
  }
  let html=''; let lastMonth='';
  past.forEach(e=>{
    const p = state.places.find(pl=>pl.id===e.placeId);
    if(!p) return;
    const d = parseDate(e.date);
    const monthLabel = d.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
    if(monthLabel!==lastMonth){ html+=`<div class="tl-month">${monthLabel}</div>`; lastMonth=monthLabel; }
    const c = catInfo(p.category);
    html += `<div class="tl-item" onclick="openPlaceDetail('${p.id}')">
      <span class="dot" style="background:${c.hex}"></span>
      <div class="info">
        <div class="top"><span class="name">${escapeHtml(p.name)}</span><span class="date">${d.getDate()} ${d.toLocaleDateString('pt-BR',{month:'short'})}</span></div>
        ${e.note? `<div class="note">${escapeHtml(e.note)}</div>` : ''}
        ${e.rating? `<div class="stars">${'★'.repeat(e.rating)}${'☆'.repeat(5-e.rating)}</div>`:''}
        ${e.photo? `<img src="${escapeHtml(e.photo)}" onerror="this.style.display='none'" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-top:6px">`:''}
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

/* ---------- SORTEIO ---------- */
function openSorteio(){
  sorteioCategorias = new Set();
  sorteioExcluirDias = 0;
  sorteioCurrentResult = null;
  const chipRow = document.getElementById('sCategoriaChips');
  chipRow.innerHTML = state.categories.map(o=>{
    const hex = catInfo(o.key).hex;
    return `<button type="button" class="chip" style="--cat-color:${hex}" data-key="${o.key}" onclick="selectSorteioCat('${o.key}')">${o.label}</button>`;
  }).join('');
  document.getElementById('sCidade').value = '';
  document.getElementById('sorteioResultArea').innerHTML = '';
  document.querySelectorAll('#sExcluirRow .toggle-opt').forEach(b=>b.classList.toggle('selected', b.dataset.v==='0'));
  openOverlayEl('overlaySorteio');
}
function selectSorteioCat(key){
  if(sorteioCategorias.has(key)) sorteioCategorias.delete(key); else sorteioCategorias.add(key);
  document.querySelectorAll('#sCategoriaChips .chip').forEach(ch=>ch.classList.toggle('selected', sorteioCategorias.has(ch.dataset.key)));
}
function setExcluir(v){
  sorteioExcluirDias = v;
  document.querySelectorAll('#sExcluirRow .toggle-opt').forEach(b=>b.classList.toggle('selected', Number(b.dataset.v)===v));
}
function rollSorteio(){
  const cidade = document.getElementById('sCidade').value.trim().toLowerCase();
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-sorteioExcluirDias);
  const cutoffStr = fmtDate(cutoff);
  let candidates = sorteioCategorias.size ? state.places.filter(p=>sorteioCategorias.has(p.category)) : state.places.slice();
  if(cidade) candidates = candidates.filter(p=>(p.city||'').toLowerCase().includes(cidade));
  if(sorteioExcluirDias>0){
    candidates = candidates.filter(p=>{
      const visited = state.events.some(e=>e.placeId===p.id && e.date>=cutoffStr && e.date<=todayStr());
      return !visited;
    });
  }
  const area = document.getElementById('sorteioResultArea');
  if(candidates.length===0){
    area.innerHTML = `<div class="sorteio-result"><div class="dice">😕</div><p style="color:var(--text-dim);font-size:13.5px;margin-top:8px">Nenhuma ideia encontrada com esses filtros.<br>Cadastre mais opções ou ajuste os filtros.</p></div>`;
    return;
  }
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  sorteioCurrentResult = pick;

  // Animação de roleta: cicla nomes rapidamente antes de revelar o resultado
  area.innerHTML = `<div class="sorteio-result"><div class="roleta-name" id="roletaName">${escapeHtml(candidates[0].name)}</div></div>`;
  const roletaEl = document.getElementById('roletaName');
  let ticks = 0;
  const maxTicks = 16;
  const interval = setInterval(()=>{
    ticks++;
    const randomOne = candidates[Math.floor(Math.random()*candidates.length)];
    roletaEl.textContent = randomOne.name;
    if(ticks>=maxTicks){
      clearInterval(interval);
      showSorteioResult(pick, cidade);
    }
  }, 90);
}
async function showSorteioResult(pick, cidadeBuscada){
  const area = document.getElementById('sorteioResultArea');
  const c = catInfo(pick.category);
  area.innerHTML = `<div class="sorteio-result">
    <div class="dice">🎉</div>
    <span class="cat-tag" style="background:${c.hex}33;color:${c.hex}">${c.label}</span>
    <h3>${escapeHtml(pick.name)}</h3>
    <div class="addr">${pick.city? escapeHtml(pick.city):''}${pick.address? ' · '+escapeHtml(pick.address):''} · ${'💰'.repeat(Number(pick.price||1))}</div>
    ${pick.notes? `<div class="notes">${escapeHtml(pick.notes)}</div>`:''}
    <div class="sorteio-weather" id="sorteioWeatherLine">Buscando clima...</div>
    <div style="display:flex; gap:8px; margin-top:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="compartilharSorteio()">📤 Compartilhar</button>
      <button class="btn btn-primary" style="flex:1" onclick="closeOverlay('overlaySorteio'); requireAuth(()=>{openEventForm(todayStr()); document.getElementById('eSelectPlace').value='${pick.id}';})">Marcar para hoje</button>
    </div>
  </div>`;
  const cidadeClima = pick.city || cidadeBuscada || 'Curitiba';
  const teaser = await getWeatherTeaser(cidadeClima);
  const line = document.getElementById('sorteioWeatherLine');
  if(line) line.textContent = teaser || '';
}
function compartilharSorteio(){
  if(!sorteioCurrentResult) return;
  compartilharIdeia(sorteioCurrentResult.id);
}

/* ---------- GERENCIAR CATEGORIAS ---------- */
let categoriasEdit = [];
function openCategoriasManager(){
  categoriasEdit = state.categories.map(c=>({...c}));
  renderCategoriasList();
  openOverlayEl('overlayCategorias');
}
function renderCategoriasList(){
  document.getElementById('categoriasList').innerHTML = categoriasEdit.map((c,i)=>`
    <div style="display:flex; align-items:center; gap:8px;">
      <input type="color" value="${c.hex}" oninput="categoriasEdit[${i}].hex=this.value; document.getElementById('catDot${i}').style.background=this.value" style="width:34px;height:34px;border:none;background:none;padding:0;border-radius:8px;flex-shrink:0" id="catDot${i}">
      <input type="text" value="${escapeHtml(c.label)}" oninput="categoriasEdit[${i}].label=this.value" style="flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 10px; font-size:13.5px;">
      <button onclick="removeCategoriaEdit(${i})" style="background:none; color:var(--text-faint); font-size:16px; width:28px;">✕</button>
    </div>
  `).join('');
}
function addCategoria(){
  const usedColors = categoriasEdit.map(c=>c.hex);
  const nextColor = COLOR_POOL.find(hex=>!usedColors.includes(hex)) || COLOR_POOL[categoriasEdit.length % COLOR_POOL.length];
  categoriasEdit.push({ key: 'cat-'+uid(), label: 'Nova categoria', hex: nextColor });
  renderCategoriasList();
}
function removeCategoriaEdit(i){
  const cat = categoriasEdit[i];
  const emUso = state.places.some(p=>p.category===cat.key);
  if(emUso && !confirm('Algumas ideias usam essa categoria. Elas continuam existindo, mas ficam sem cor/categoria definida. Excluir mesmo assim?')) return;
  categoriasEdit.splice(i,1);
  renderCategoriasList();
}
async function saveCategorias(){
  if(categoriasEdit.some(c=>!c.label.trim())){ alert('Toda categoria precisa de um nome.'); return; }
  state.categories = categoriasEdit;
  await saveState();
  closeOverlay('overlayCategorias');
  populateFilters(); renderPlaces(); renderCalendar(); renderTimeline(); renderProximo();
}
/* ---------- INIT ---------- */
function renderAll(){
  populateFilters();
  renderCounter();
  renderProximo();
  renderWeekStrip();
  renderPlaces();
  renderCalendar();
  renderTimeline();
}
/* ---------- CLIMA (Open-Meteo, gratuito, sem chave de API) ---------- */
let climaLoadedOnce = false;
function wmoInfo(code){
  const map = {
    0:['☀️','Céu limpo'], 1:['🌤️','Poucas nuvens'], 2:['⛅','Parcialmente nublado'], 3:['☁️','Nublado'],
    45:['🌫️','Neblina'], 48:['🌫️','Neblina com geada'],
    51:['🌦️','Garoa leve'], 53:['🌦️','Garoa'], 55:['🌧️','Garoa forte'],
    61:['🌧️','Chuva leve'], 63:['🌧️','Chuva'], 65:['🌧️','Chuva forte'],
    71:['🌨️','Neve leve'], 73:['🌨️','Neve'], 75:['❄️','Neve forte'],
    80:['🌦️','Pancadas leves'], 81:['🌧️','Pancadas de chuva'], 82:['⛈️','Pancadas fortes'],
    95:['⛈️','Trovoadas'], 96:['⛈️','Trovoadas com granizo'], 99:['⛈️','Trovoadas fortes'],
  };
  return map[code] || ['🌡️','—'];
}
async function buscarClima(){
  const cidade = document.getElementById('climaCidadeInput').value.trim() || 'Curitiba';
  const content = document.getElementById('climaContent');
  content.innerHTML = `<div class="empty-state">Buscando previsão para ${escapeHtml(cidade)}...</div>`;
  try{
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt&format=json`);
    const geoData = await geoRes.json();
    if(!geoData.results || geoData.results.length===0){
      content.innerHTML = `<div class="empty-state">Não encontramos "${escapeHtml(cidade)}". Tenta o nome da cidade sem acento ou com o estado (ex: Curitiba, PR).</div>`;
      return;
    }
    const loc = geoData.results[0];
    const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=16&timezone=auto`);
    const wData = await wRes.json();
    renderClima(loc, wData);
  }catch(err){
    content.innerHTML = `<div class="empty-state">Não deu pra buscar a previsão agora. Confere sua conexão e tenta de novo.</div>`;
  }
}
function renderClima(loc, w){
  const content = document.getElementById('climaContent');
  const cur = w.current_weather;
  const [curIcon, curDesc] = wmoInfo(cur.weathercode);
  const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const daysHtml = w.daily.time.map((ds,i)=>{
    const [icon] = wmoInfo(w.daily.weathercode[i]);
    const d = parseDate(ds);
    const rain = w.daily.precipitation_probability_max[i];
    return `<div class="clima-day">
      <div class="cd-dow">${i===0? 'Hoje': dows[d.getDay()]+' '+d.getDate()}</div>
      <div class="cd-icon">${icon}</div>
      <div class="cd-max">${Math.round(w.daily.temperature_2m_max[i])}°</div>
      <div class="cd-min">${Math.round(w.daily.temperature_2m_min[i])}°</div>
      ${rain>=30? `<div class="cd-rain">💧${rain}%</div>`:''}
    </div>`;
  }).join('');
  content.innerHTML = `
    <div class="clima-current">
      <span class="cc-icon">${curIcon}</span>
      <div>
        <div class="cc-city">${escapeHtml(loc.name)}${loc.admin1? ', '+escapeHtml(loc.admin1):''}</div>
        <div class="cc-temp">${Math.round(cur.temperature)}°C</div>
        <div class="cc-desc">${curDesc}</div>
      </div>
    </div>
    <div class="clima-forecast-label">Próximos ${w.daily.time.length} dias</div>
    <div class="clima-days">${daysHtml}</div>
  `;
}
async function getWeatherTeaser(cidade){
  try{
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt&format=json`);
    const geoData = await geoRes.json();
    if(!geoData.results || geoData.results.length===0) return null;
    const loc = geoData.results[0];
    const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current_weather=true&timezone=auto`);
    const wData = await wRes.json();
    const [icon, desc] = wmoInfo(wData.current_weather.weathercode);
    return `${icon} ${Math.round(wData.current_weather.temperature)}°C agora em ${loc.name} · ${desc}`;
  }catch(e){ return null; }
}

loadState();
